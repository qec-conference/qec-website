{{ $_hugo_config := `{ "version": 1 }` }}
<section class="location">

	<div class="map" style="background-image: url('{{ .Get "image" }}');"{{ if .Get "embed" }} onclick="this.querySelector('iframe').style.pointerEvents='auto'" onmouseleave="this.querySelector('iframe').style.pointerEvents='none'"{{ end }}>
		{{ with .Get "embed" }}<iframe src="{{ . }}" title="Map" loading="lazy" style="width: 100%; height: 100%; border: 0; pointer-events: none;"></iframe>{{ end }}
	</div>

	<div class="description">
		<div class="inner">
			{{ .Inner }}
		</div>

		<div class="direction">
			{{ .Get "address" }}

			<a href="https://www.google.com/maps/dir/?api=1&destination={{ .Get "address" }}"
				class="btn btn-icon-only" target="_blank" rel="noreferrer"
			   aria-label="{{ i18n "home_location_direction" }}">
				{{ partial "icon.html" "direction" }}
			</a>

		</div>

	</div>
</section>
