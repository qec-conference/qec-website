# publishDir = "docs"

baseURL = "https://tqc-website.netlify.app/"
languageCode = "en"
title = "TQC Conference Website"

# Theme
theme = "devfest-theme-hugo"

# Params
enableEmoji = true
enableRobotsTXT = true
enableMissingTranslationPlaceholders = true

# Google Analytics are currently disabled, 
# using it would officially require a cookie banner at least in the EU, and we don't have one...
# it's probably better not to track people anyways.
# GoogleAnalytics = "G-221GMGECQ6"

# [services]
#   [services.googleAnalytics]
#     id = "G-221GMGECQ6"

[params]
    title = "TQC Conference Website"
    date = "2025-09-15"
        currentYear = 2026
        description = "International Conference on Theory of Quantum Computation, Communication and Cryptography (TQC)"
        images = ["/images/social-share.jpg"]
        email = "webmaster@tqc-conference.org"
        keywords = "event, quantum computation, communication, cryptography, TQC"
        copyright = "We :heart: quantum"
        copyright_link = "https://github.com/IAQI/tqc-website"
        # cfpUrl = "/2024/call"
        # subscriptionUrl = ""
        appleTouchIcon = "/apple-touch-icon.png"
        favicon32 = "/favicon-32x32.png"
        favicon16 = "/favicon-16x16.png"
        manifest = "/site.webmanifest"
        # safariPinnedTab = "/safari-pinned-tab.svg"
    
    [params.2026]
      city = "TBD"
      timeanddate_cityid = 775 ## Placeholder ID, update as needed!
      themeColor = "#1e88e5"
      [params.2026.logos]
        jumbo = "/images/2026/background-2026.png"
        header = "/images/2026/tqc-logo-2026.png"
        banner = "/images/2026/banner-2026.jpg"    
    
    [params.logos]
        footer = "/images/logos/netlify-color-accent.svg"
        footer_link = "https://www.netlify.com"
    
    [server]
      [[server.redirects]]
          from = "/"
          to = "/2026/"
          status = 302
          force = true 


[languages]
[languages.en]
    weight = 1
    languageName = "us"

[taxonomies]
    tag = "tags"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[privacy]
    [privacy.disqus]
        disable = true
    [privacy.googleAnalytics]
        anonymizeIP = false
        disable = false
        respectDoNotTrack = false
        useSessionStorage = false
    [privacy.instagram]
        disable = true
        simple = false
    [privacy.twitter]
        disable = false
        enableDNT = false
        simple = false
    [privacy.vimeo]
        disable = true
        simple = false
    [privacy.youtube]
        disable = true
        privacyEnhanced = true






  [[menu.2026]]
    name = "Home"
